name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: packages/core

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy src/
      - name: Packaged artefacts present
        run: |
          python - <<'PY'
          from pathlib import Path

          import pint_ae

          root = Path(pint_ae.__file__).parent
          needed = [
              root / "schematron" / "vendor" / "pint-ae-1.0.4" / "shared.xslt",
              root / "schematron" / "vendor" / "pint-ae-1.0.4" / "jurisdiction.xslt",
              root / "schematron" / "vendor" / "pint-ae-sb-1.0.4" / "shared.xslt",
              root / "xsd",
          ]
          missing = [str(path) for path in needed if not path.exists()]
          assert not missing, missing
          print("artefacts present")
          PY
      - name: Self-test
        run: pint-ae selftest
      - name: Corpus round trip
        run: |
          pint-ae corpus --out "$RUNNER_TEMP/demo"
          pint-ae diagnose "$RUNNER_TEMP/demo/documents" --json "$RUNNER_TEMP/demo/results.json" || test $? -eq 1
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "demo" / "results.json").read_text(encoding="utf-8")
          )
          assert payload["header"]["schema"] == "pint-ae/results-v1"
          assert payload["summary"]["total"] == 100
          assert payload["summary"]["clean"] == 60
          print("corpus round trip ok")
          PY
