[project]
name = "pint-ae-toolkit"
version = "0.6.1"
description = "PINT AE toolkit - parsing, validation, and diagnostics for UAE e-invoicing"
requires-python = ">=3.11"
license = { text = "Business Source License 1.1" }
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Intended Audience :: Financial and Insurance Industry",
]
dependencies = ["lxml>=5.0", "pydantic>=2.5", "typer>=0.12", "rich>=13.0", "reportlab>=4.0", "arabic-reshaper>=3.0", "python-bidi>=0.4", "saxonche>=13.0", "cryptography>=42"]

[project.urls]
Homepage = "https://github.com/pint-ae/showcase"
Standard = "https://docs.peppol.eu/poac/ae/pint-ae/"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "pre-commit", "lxml-stubs", "pypdf>=4.0", "ipykernel>=6.20", "nbformat>=5.7", "jupyterlab>=4.0"]

[project.scripts]
pint-ae = "pint_ae.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pint_ae"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/pint_ae/cli.py" = ["B008"]
"src/pint_ae/pdf.py" = ["E501"]
"src/pint_ae/rules.py" = ["E501"]
"src/pint_ae/corpus.py" = ["E501"]
"src/pint_ae/modules.py" = ["E501"]
"tests/fixtures/malformed/_generate.py" = ["E501", "I001"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage floor: measured 79% locally with the sandbox-blocked test files
# excluded, higher in CI where the whole suite runs. The floor exists so a block
# cannot quietly delete its own evidence.
addopts = "--cov=pint_ae --cov-report=term-missing --cov-fail-under=78"
[[tool.mypy.overrides]]
module = [
    "reportlab.*",
    "arabic_reshaper.*",
    "bidi.*",
    "pypdf.*",
    "saxonche.*",
]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "pint_ae.pdf"
disallow_untyped_defs = false
warn_return_any = false
